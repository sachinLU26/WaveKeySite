<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<title>Acoustic Emission Physics</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000000;
  }

  /* Keyframe animations for continuous concentric ripple emission */
  @keyframes ripple-pulse {
    0% {
      transform: translate(-50%, -50%) scale(0.18);
      opacity: 0;
    }
    15% {
      opacity: 0.65;
    }
    50% {
      opacity: 0.35;
    }
    85% {
      opacity: 0.12;
    }
    100% {
      transform: translate(-50%, -50%) scale(2.8);
      opacity: 0;
    }
  }

  .ripple-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 580px;
    height: 580px;
    border-radius: 50%;
    pointer-events: none;
    border: 1.5px solid rgba(0, 242, 254, 0.55);
    box-shadow: 0 0 16px rgba(0, 220, 230, 0.28), inset 0 0 12px rgba(0, 242, 254, 0.15);
    animation: ripple-pulse 7s cubic-bezier(0.1, 0.45, 0.3, 1) infinite;
    transform: translate(-50%, -50%) scale(0.18);
    opacity: 0;
  }

  /* Slight chromatic dispersion ring layering */
  .ripple-ring.secondary {
    border-color: rgba(67, 237, 205, 0.45);
    box-shadow: 0 0 20px rgba(0, 208, 178, 0.25);
  }

  /* Delays to create smooth continuous waves */
  .r-1 { animation-delay: 0s; }
  .r-2 { animation-delay: 1.16s; }
  .r-3 { animation-delay: 2.33s; }
  .r-4 { animation-delay: 3.5s; }
  .r-5 { animation-delay: 4.66s; }
  .r-6 { animation-delay: 5.83s; }

  /* Subtle pulsing core on phone infinity emblem */
  @keyframes core-glow {
    0%, 100% {
      filter: drop-shadow(0 0 6px rgba(0, 242, 254, 0.35));
    }
    50% {
      filter: drop-shadow(0 0 14px rgba(0, 242, 254, 0.75));
    }
  }

  .core-pulse {
    animation: core-glow 3.5s ease-in-out infinite;
  }
</style>
</head>
<body class="bg-black flex items-center justify-center min-h-screen relative select-none">
<!-- Acoustic Ripples propagating outward from center -->
<div class="absolute inset-0 flex items-center justify-center overflow-hidden pointer-events-none z-0">
<div class="ripple-ring r-1"></div>
<div class="ripple-ring secondary r-2"></div>
<div class="ripple-ring r-3"></div>
<div class="ripple-ring secondary r-4"></div>
<div class="ripple-ring r-5"></div>
<div class="ripple-ring secondary r-6"></div>
</div>
<!-- Centered Static Smartphone -->
<div class="relative z-10 flex items-center justify-center">
<!-- Phone Outer Chassis -->
<div class="relative w-[270px] h-[560px] rounded-[48px] p-[10px] bg-[#1a1c22] shadow-[0_0_0_1px_rgba(255,255,255,0.18),0_25px_60px_-15px_rgba(0,0,0,0.9),0_0_40px_rgba(0,242,254,0.06)] border border-[#3a3f4d]">
<!-- Side Buttons (Chassis details) -->
<div class="absolute -left-[3px] top-[110px] w-[3px] h-[26px] bg-[#2e3340] rounded-l-sm"></div>
<div class="absolute -left-[3px] top-[148px] w-[3px] h-[46px] bg-[#2e3340] rounded-l-sm"></div>
<div class="absolute -left-[3px] top-[204px] w-[3px] h-[46px] bg-[#2e3340] rounded-l-sm"></div>
<div class="absolute -right-[3px] top-[140px] w-[3px] h-[64px] bg-[#2e3340] rounded-r-sm"></div>
<!-- Phone Inner Screen Bezel & Display -->
<div class="relative w-full h-full rounded-[40px] bg-[#070b14] overflow-hidden flex flex-col items-center justify-between py-4 px-6 border border-[#161c28]">
<!-- Status Bar -->
<div class="w-full flex items-center justify-between text-[#d6e0ea] text-[11px] font-medium tracking-tight px-3 pt-1 z-20">
<span>9:41</span>
<!-- Dynamic Island / Speaker Pill -->
<div class="w-20 h-4 bg-black rounded-full flex items-center justify-end px-2 space-x-1">
<div class="w-2 h-2 rounded-full bg-[#111622]"></div>
</div>
<!-- Battery & Signal Status -->
<div class="flex items-center space-x-1.5 opacity-90">
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.2"></path><path d="M12 4c4.41 0 8 3.59 8 8 0 1.83-.62 3.53-1.68 4.88L12 20.85l-6.32-3.97C4.62 15.53 4 13.83 4 12c0-4.41 3.59-8 8-8z"></path></svg>
<div class="w-4 h-2 border border-current rounded-sm p-[1px] flex items-center">
<div class="w-full h-full bg-current rounded-2xs"></div>
</div>
</div>
</div>
<!-- Central Infinity Wave Node -->
<div class="relative my-auto flex items-center justify-center">
<!-- Concentric Inner Origin Rings -->
<div class="absolute w-28 h-28 rounded-full border border-cyan-400/20"></div>
<div class="absolute w-24 h-24 rounded-full border border-cyan-400/35"></div>
<div class="absolute w-20 h-20 rounded-full border border-cyan-300/50"></div>
<div class="absolute w-16 h-16 rounded-full border border-cyan-200/70"></div>
<!-- Center Infinity Badge -->
<div class="relative z-10 w-16 h-16 rounded-full bg-[#0a1120] border border-cyan-400/40 flex items-center justify-center shadow-[0_0_24px_rgba(0,242,254,0.3)] core-pulse">
<svg class="w-8 h-8 text-cyan-200" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M18.178 8c5.096 0 5.096 8 0 8-5.095 0-7.133-8-12.228-8-5.096 0-5.096 8 0 8 5.095 0 7.133-8 12.228-8z"></path>
</svg>
</div>
</div>
<!-- Bottom Home Indicator -->
<div class="w-28 h-1 bg-white/20 rounded-full mb-1"></div>
</div>
</div>
</div>
</body></html>
